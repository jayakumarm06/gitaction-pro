name: 01 - CWJK Flask CI Workflow

on:
  push:

jobs:
  flask-ci-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: docker build -t cwjk-flask-app:v1.0.0 .

      - name: Run Container
        run: docker run -d -p 5000:5000 --name cwjk-flask-container cwjk-flask-app:v1.0.0

      - name: Smoke Test
        run: |
          sleep 5
          curl http://localhost:5000/health
